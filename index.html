:root {
  --bg: #000000;
  --surface: #060807;
  --panel: #090c0b;
  --panel2: #0d1110;
  --line: #1e2a27;
  --text: #e9f2ee;
  --muted: #8ba39c;
  --faint: #5b7269;
  --v1: #39ff88;
  --v2: #66ccff;
  --v3: #ffcc00;
  --danger: #ff5d5d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #060807;
    --panel: #090c0b;
    --panel2: #0d1110;
    --line: #1e2a27;
    --text: #e9f2ee;
    --muted: #8ba39c;
    --faint: #5b7269;
    --v1: #39ff88;
    --v2: #66ccff;
    --v3: #ffcc00;
    --danger: #ff5d5d;
  }
}
html {
  background: var(--bg);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
  -webkit-font-smoothing: antialiased;
}
::-moz-selection {
  background: var(--v1);
  color: #000;
}
::selection {
  background: var(--v1);
  color: #000;
}
/* Range sliders */
input[type="range"] {
  -webkit-appearance: none;
  -moz-appearance: none;
       appearance: none;
  height: 4px;
  border-radius: 2px;
  background: var(--line);
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 0;
  background: #000;
  border: 2px solid currentColor;
  cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 0;
  background: #000;
  border: 2px solid currentColor;
  cursor: pointer;
}
/* thin scrollbars for code blocks */
.scrollthin::-webkit-scrollbar {
  height: 6px;
  width: 6px;
}
.scrollthin::-webkit-scrollbar-thumb {
  background: var(--line);
}
.scrollthin::-webkit-scrollbar-track {
  background: transparent;
}
@keyframes pulse-dot {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.25;
  }
}
.pulse-dot {
  animation: pulse-dot 1.6s ease-in-out infinite;
}
@keyframes flowdash {
  to {
    stroke-dashoffset: -14;
  }
}
.flow-line {
  stroke-dasharray: 5 4;
  animation: flowdash 1.2s linear infinite;
}
.hover\:border-\[var\(--v2\)\]:hover {
  border-color: var(--v2);
}
.hover\:text-\[var\(--v2\)\]:hover {
  color: var(--v2);
}
@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));

  .sm\:px-3 {

  .sm\:text-2xl {

  }
  .sm\:text-\[11px\] {
    font-size: 11px;
  }
  .sm\:text-\[13px\] {
    font-size: 13px;
  }
  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }
  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
@media (min-width: 768px) {
  .md\:inline {
    display: inline;
  }

    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
@media (min-width: 1024px) {

  }

    grid-template-columns: repeat(2, minmax(0, 1fr));

    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
